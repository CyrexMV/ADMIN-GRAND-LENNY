<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="65%">
      <stop offset="0" stop-color="#1a2a66"/>
      <stop offset=".6" stop-color="#0b1230"/>
      <stop offset="1" stop-color="#050816"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0fbff"/>
      <stop offset=".35" stop-color="#22d3ee"/>
      <stop offset=".7" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#e9dfe0"/>
      <stop offset="1" stop-color="#9d8f91"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2457"/>
      <stop offset="1" stop-color="#090d22"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d946ef"/>
      <stop offset="1" stop-color="#7c1d8f"/>
    </linearGradient>
    <path id="arc-top" d="M 120 400 A 280 280 0 0 1 680 400"/>
    <path id="arc-bottom" d="M 82 400 A 318 318 0 0 0 718 400"/>
  </defs>

  <rect width="800" height="800" fill="url(#bg)"/>

  <!-- Skyline -->
  <g fill="#22d3ee" opacity=".1">
    <rect x="150" y="470" width="40" height="150"/>
    <rect x="196" y="420" width="34" height="200"/>
    <rect x="236" y="450" width="46" height="170"/>
    <rect x="520" y="440" width="44" height="180"/>
    <rect x="570" y="400" width="36" height="220"/>
    <rect x="612" y="470" width="40" height="150"/>
  </g>

  <!-- Ringe -->
  <circle cx="400" cy="400" r="384" fill="none" stroke="url(#metal)" stroke-width="14"/>
  <circle cx="400" cy="400" r="362" fill="none" stroke="url(#metal)" stroke-width="2" opacity=".6"/>
  <circle cx="400" cy="400" r="252" fill="none" stroke="url(#metal)" stroke-width="3" opacity=".8"/>

  <text font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="38" letter-spacing="10" fill="url(#silver)">
    <textPath href="#arc-top" startOffset="50%" text-anchor="middle">GRAND RP</textPath>
  </text>
  <text font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="22" letter-spacing="6" fill="#67e8f9">
    <textPath href="#arc-bottom" startOffset="50%" text-anchor="middle" dominant-baseline="hanging">LOS SANTOS ROLEPLAY · DE1</textPath>
  </text>
  <g fill="url(#metal)">
    <circle cx="82" cy="400" r="6"/>
    <circle cx="718" cy="400" r="6"/>
  </g>

  <!-- Schild -->
  <path d="M400 186 L556 238 V392 C556 488 488 552 400 590 C312 552 244 488 244 392 V238 Z"
        fill="url(#shield)" stroke="url(#metal)" stroke-width="8" stroke-linejoin="round"/>
  <path d="M400 210 L534 254 V392 C534 474 476 530 400 564 C324 530 266 474 266 392 V254 Z"
        fill="none" stroke="#22d3ee" stroke-opacity=".35" stroke-width="2"/>

  <!-- Sterne -->
  <g fill="url(#metal)">
    <path d="M400 150 l7 15 16 2 -12 11 3 16 -14 -8 -14 8 3 -16 -12 -11 16 -2z"/>
    <path d="M352 166 l5 10 11 1.5 -8 7.5 2 11 -10 -5.5 -10 5.5 2 -11 -8 -7.5 11 -1.5z"/>
    <path d="M448 166 l5 10 11 1.5 -8 7.5 2 11 -10 -5.5 -10 5.5 2 -11 -8 -7.5 11 -1.5z"/>
  </g>

  <!-- Monogramm -->
  <text x="400" y="452" text-anchor="middle" font-family="Arial Black, Impact, Arial, Helvetica, sans-serif" font-weight="900" font-size="156" letter-spacing="-4" fill="url(#metal)" stroke="#070a1c" stroke-width="3" paint-order="stroke">LK</text>

  <!-- Banner -->
  <path d="M210 560 L590 560 L572 596 L590 632 L210 632 L228 596 Z" fill="url(#ribbon)" stroke="#f5d0fe" stroke-opacity=".5" stroke-width="2"/>
  <path d="M210 560 L184 550 L192 590 L210 632 Z M590 560 L616 550 L608 590 L590 632 Z" fill="#4c1366"/>
  <text x="400" y="612" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="40" letter-spacing="5" fill="#fff3f1">LENNY KOK</text>

  <text x="400" y="668" text-anchor="middle" font-family="Courier New, monospace" font-weight="700" font-size="24" letter-spacing="4" fill="#67e8f9">ID 126082</text>
</svg>
